# Note: `docker compose` prints "variable is not set" warnings referencing
# fragments of ADMIN_PASSWORD_HASH from .env — that's Compose's own .env
# pre-scan for ${...} substitution tripping over the bcrypt hash's literal
# "$" characters. Harmless: the backend service reads .env directly via a
# file mount (see below), never through Compose's interpolation pipeline.

services:
  mongo-keyfile:
    image: mongo:7.0
    entrypoint: ["/bin/bash", "-c", "test -s /keys/keyfile || openssl rand -base64 756 > /keys/keyfile; chown 999:999 /keys/keyfile; chmod 400 /keys/keyfile"]
    volumes:
      - mongodb_keyfile:/keys

  replica-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
    volumes:
      - ./scripts/init-replica.js:/init-replica.js:ro
    entrypoint: ["mongosh", "--nodb", "--quiet", "/init-replica.js"]

  mongodb:
    image: mongo:7.0
    container_name: pflegedienst_mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo-keyfile/keyfile"]
    depends_on:
      mongo-keyfile:
        condition: service_completed_successfully
    restart: unless-stopped
    
    # Environment
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-pflegedienst_db}
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}

    # Ports (bound to localhost only — never expose the DB port publicly)
    ports:
      - "127.0.0.1:27017:27017"

    # Data persistence
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./app/db/validators.json:/docker-entrypoint-initdb.d/validators.json:ro
      - mongodb_keyfile:/etc/mongo-keyfile:ro

    # Health check
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh localhost:27017 --quiet --username ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env} --password ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    
    # Resource limits (adjust for your machine)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security
    security_opt:
      - no-new-privileges:true

  backend:
    build: .
    container_name: pflegedienst_backend
    restart: unless-stopped
    depends_on:
      schema-migrate:
        condition: service_completed_successfully

    environment:
      # Override MONGODB_URI from .env: inside this network the DB is reachable
      # by service name ("mongodb"), not "localhost" (which .env is set up for
      # when running the backend directly on the host). The app's own
      # load_dotenv() never overrides an already-set env var, so this wins
      # over whatever MONGODB_URI is in the mounted .env file below.
      MONGODB_URI: ""
      MONGODB_HOST: mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-pflegedienst_db}
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./cache:/app/cache
      - ./logs:/app/logs
      # Mounted as a file, not env_file: Compose's env_file interpolation
      # mangles literal "$" characters (bcrypt hashes are full of them,
      # e.g. $2b$12$...). Reading it via the app's own load_dotenv() avoids
      # that entirely and matches exactly how it's read on the host.
      - ./.env:/app/.env:ro

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true

  schema-migrate:
    build: .
    depends_on:
      replica-init:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: ""
      MONGODB_HOST: mongodb:27017
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-pflegedienst_db}
      MONGO_APP_USER: ${MONGO_APP_USER:?Set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    volumes:
      - ./.env:/app/.env:ro
    command: ["python", "scripts/migrate_accounting.py", "--apply"]
    restart: "no"

  # Mongo Express - MongoDB Admin UI (optional, for development)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: pflegedienst_mongo_express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:?Set MONGO_ROOT_USER in .env}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:?Set MONGO_EXPRESS_USER in .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in .env}
    
    # Admin UI — localhost only, never expose publicly
    ports:
      - "127.0.0.1:8081:8081"
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_keyfile:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  default:
    name: pflegedienst_network
