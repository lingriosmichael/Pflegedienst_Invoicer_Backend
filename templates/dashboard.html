<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pflegedienst Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f6fb; color: #0f172a; }
    h1 { margin-bottom: 0.1rem; }
    p { margin-top: 0; color: #475569; }
    .grid { display: grid; gap: 1rem; margin-top: 1rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 0.75rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 30px rgba(15,23,42,0.08);
    }
    .card h2 { margin: 0 0 0.25rem; font-size: 1.05rem; }
    .card p { margin: 0 0 0.75rem; font-size: 0.9rem; color: #475569; }
    .card a {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    .card a:hover { text-decoration: underline; }
    .helper { display: inline-block; margin-top: 0.5rem; padding: 0.25rem 0.6rem; background: #fef9c3; border-radius: 999px; font-size: 0.75rem; color: #92400e; }
  </style>
</head>
<body>
  <h1>Pflegedienst RAG dashboard</h1>
  <p>Use this shell to jump into the new RAG tooling without remembering endpoint URLs.</p>

  <div class="grid">
    {% for action in actions %}
    <div class="card">
      <h2>{{ action.title }}</h2>
      <p>{{ action.description }}</p>
      <a href="{{ action.path }}">{{ action.path }}</a>
    </div>
    {% endfor %}
  </div>

  <div class="helper">
    Request the dashboard with <code>GET /dashboard</code> from any browser or API client.
  </div>
</body>
</html>
